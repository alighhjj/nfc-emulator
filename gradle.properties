# ============================================================================
# Gradle 全局配置
# ----------------------------------------------------------------------------
# 说明：本仓库刻意把「能不能编出来」这件事交给 CI 兜底。本地只需要 JDK 17，
#      不需要 Android SDK —— assembleDebug 需要 SDK，但 :core-nfcc:test 不需要。
# ============================================================================

# 堆内存：Compose + R8 的 release 构建在 2G 下容易 OOM，CI 的 runner 有 7G 可用。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 并行 & 缓存：多模块下收益明显
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存暂时不开。AGP 8.7 + Kotlin 2.0 组合下部分任务（lint / R8）仍有
# 不兼容，开了会以 "configuration cache problems" 让 CI 变红，得不偿失。

# AndroidX
android.useAndroidX=true

# 非传递 R class：模块间不互相暴露资源 id，编译更快也避免命名冲突
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 允许在 AGP 未声明支持的 compileSdk 上继续构建（此处 compileSdk=35，AGP 8.7 已支持，
# 留着只是防止将来升 compileSdk 时被一句警告打断）
android.suppressUnsupportedCompileSdk=35
